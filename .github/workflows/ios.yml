name: iOS CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
      - name: Static project validation
        run: xcodebuild -project FinanceApp.xcodeproj -scheme FinanceApp -showBuildSettings >/dev/null
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test -project FinanceApp.xcodeproj -scheme FinanceApp \
            -destination 'platform=iOS Simulator,name=iPhone 17' CODE_SIGNING_ALLOWED=NO
